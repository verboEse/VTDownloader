# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build

on: [pull_request, push]

jobs:
  build:
    name: Build on Java ${{ matrix.java }}
    strategy:
      matrix:
        # Use these Java versions
        java: [
            21, # Minimum supported by Minecraft
          ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}

      - name: Make gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Built mod on JDK ${{ matrix.java }}
          path: build/libs/*.jar

      - name: Determine release info
        id: release_info
        if: ${{ github.event_name == 'push' }}
        run: |
          VT_VERSION=$(grep -E '^vt_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          MOD_VERSION=$(grep -E '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          RELEASE_NAME="VTDownloader ${VT_VERSION}-${MOD_VERSION}"
          TAG_NAME="${VT_VERSION}-${MOD_VERSION}"
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' }}
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          release_name: ${{ steps.release_info.outputs.release_name }}
          body: "Automated release for ${{ steps.release_info.outputs.release_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
