# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build

on: [pull_request, push]

jobs:
  build:
    name: Build on Java ${{ matrix.java }}
    strategy:
      matrix:
        # Use these Java versions
        java: [
            21, # Minimum supported by Minecraft
          ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}

      - name: Make gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Built mod on JDK ${{ matrix.java }}
          path: build/libs/*.jar

      - name: Determine release info
        id: release_info
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          VT_VERSION=$(grep -E '^vt_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          MOD_VERSION=$(grep -E '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          MC_VERSION=$(grep -E '^minecraft = ' gradle/libs.versions.toml | cut -d'"' -f2)
          RELEASE_NAME="VTDownloader ${VT_VERSION}-${MOD_VERSION}"
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "mc_version=${MC_VERSION}" >> $GITHUB_OUTPUT
          echo "mod_version=${MOD_VERSION}" >> $GITHUB_OUTPUT

          # Find the actual JAR filenames
          MOD_JAR=$(ls build/libs/vt-downloader-*.jar | grep -v sources)
          SOURCES_JAR=$(ls build/libs/vt-downloader-*-sources.jar)
          echo "mod_jar=${MOD_JAR}" >> $GITHUB_OUTPUT
          echo "sources_jar=${SOURCES_JAR}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          release_name: ${{ steps.release_info.outputs.release_name }}
          body: "Automated release for ${{ steps.release_info.outputs.release_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR to Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.release_info.outputs.mod_jar }}
          asset_name: vtdownloader-fabric-${{ steps.release_info.outputs.mc_version }}-${{ steps.release_info.outputs.mod_version }}.jar
          asset_content_type: application/java-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Sources JAR to Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.release_info.outputs.sources_jar }}
          asset_name: vtdownloader-fabric-${{ steps.release_info.outputs.mc_version }}-${{ steps.release_info.outputs.mod_version }}-sources.jar
          asset_content_type: application/java-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
